name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
      - name: Syntax check
        run: find plugin tests/integration -name '*.php' -print0 | xargs -0 -n1 php -l

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.8', '7.1']
        elementor: ['4.2.4']
    steps:
      - uses: actions/checkout@v4
      - name: Run compatibility pair
        env:
          WORDPRESS_VERSION: ${{ matrix.wordpress }}
          ELEMENTOR_VERSION: ${{ matrix.elementor }}
        run: make test-integration-docker

  plugin-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin zip
        run: make package-plugin
      - name: Verify archive root
        run: unzip -l build/wpx.zip | grep -q 'agent-control-plane-for-elementor/agent-control-plane-for-elementor.php'

  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./plugin/agent-control-plane-for-elementor
