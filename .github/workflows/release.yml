name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"
          make release VERSION="$VERSION"
          cd build
          sha256sum wpx.zip wpx-darwin-* wpx-linux-* > checksums.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/wpx.zip
            build/wpx-darwin-arm64
            build/wpx-darwin-amd64
            build/wpx-linux-amd64
            build/wpx-linux-arm64
            build/checksums.txt
